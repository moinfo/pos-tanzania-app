<style>
body{margin:0}

.card{background:#fff;border:1px solid #E9ECEF;border-left:4px solid #1565C0;border-radius:4px 16px 16px 4px;overflow:hidden}

.eyebrow{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#42A5F5}

.bi.on{color:#1565C0;font-weight:700}.bi.on .ico{background:#1565C0;color:#fff}
.fab{position:absolute;right:16px;height:54px;padding:0 20px 0 16px;border-radius:16px;border:0;background:#1565C0;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(43,45,66,.28);cursor:pointer}

.kv{display:flex;justify-content:space-between;align-items:center;min-height:38px;font-size:14px}
.kv span:first-child{color:#2B2D42}.kv span:last-child{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
.rng{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E9ECEF;border-radius:16px;padding:8px 8px 8px 10px}
.rng .t{width:36px;height:36px;border-radius:10px;background:#DBEAFE;color:#1E40AF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rng b{flex-grow:1;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#2B2D42}
.rng button{height:40px;padding:0 14px;border-radius:12px;border:0;background:#DBEAFE;color:#1E40AF;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
main>*{flex-shrink:0}

    <div style="position:relative;z-index:1;padding:8px 0 0 0;display:flex;flex-direction:column;gap:2px;max-width:250px"><span class="eyebrow">Customers</span><h1 class="ttl">Customer Transactions</h1></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:4px;display:flex" aria-hidden="true"><i style="flex:1;background:#1565C0"></i><i style="flex:1;background:#F59E0B"></i><i style="flex:1;background:#10B981"></i></div>
  </header><main style="flex-grow:1;display:flex;flex-direction:column;gap:14px;padding:16px 16px 110px 16px"><div class="seg" role="tablist"><button role="tab" aria-selected="true">Deposits</button><button role="tab" aria-selected="false">Withdrawals</button></div><div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="cu" style="font-size:13px;font-weight:600;color:#2B2D42">Select customer</label><div style="position:relative"><input id="cu" class="inp" type="search" placeholder="Tap to search…" style="padding-right:44px"><span style="position:absolute;right:14px;top:14px;color:#6C757D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span></div></div>
