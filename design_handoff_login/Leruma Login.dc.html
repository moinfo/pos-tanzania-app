<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9ECF1;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
a{color:#1D7DC4}a:hover{color:#084BA6}
*{-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:none;background:none;padding:0;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#A3ADBC;font-weight:600}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">

<div style="height:100%;display:flex;flex-direction:column;background:#F4F7FA;position:relative;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F172A">

  <div style="position:absolute;top:0;left:0;right:0;height:330px;background:linear-gradient(180deg,#EAF2FA 0%,#F4F7FA 78%)"></div>
  <svg viewBox="0 0 402 300" preserveAspectRatio="xMidYMid slice" style="position:absolute;top:0;left:0;width:100%;height:300px">
    <ellipse cx="201" cy="150" rx="188" ry="78" fill="none" stroke="#1D7DC4" stroke-width="30" opacity=".18" transform="rotate(-18 201 150)"></ellipse>
    <ellipse cx="201" cy="150" rx="188" ry="78" fill="none" stroke="#103863" stroke-width="9" opacity=".16" transform="rotate(-11 201 150)"></ellipse>
    <ellipse cx="201" cy="150" rx="142" ry="52" fill="none" stroke="#1D7DC4" stroke-width="1.5" opacity=".35" transform="rotate(-25 201 150)"></ellipse>
  </svg>
  <div style="position:absolute;top:150px;left:0;right:0;height:180px;background:linear-gradient(180deg,rgba(244,247,250,0) 0%,#F4F7FA 78%)"></div>

  <div style="flex:none;position:relative;padding:52px 18px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #E4EAF2;border-radius:999px;padding:6px 12px 6px 8px;box-shadow:0 2px 8px rgba(16,56,99,.06)">
      <span style="width:7px;height:7px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.15)"></span>
      <span style="font-size:11.5px;font-weight:800;letter-spacing:.4px;color:#5A6577">ONLINE</span>
    </span>
    <button style="width:38px;height:38px;border-radius:12px;background:#FFFFFF;border:1px solid #E4EAF2;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(16,56,99,.06)" style-active="background:#EEF2F7" aria-label="Theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5A6577"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg>
    </button>
  </div>

  <div style="flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 26px 22px">
    <div style="background:#fff;border-radius:24px;padding:14px 20px;box-shadow:0 14px 36px rgba(16,56,99,.14),0 2px 6px rgba(16,56,99,.06)">
      <img src="./assets/leruma-logo.svg" alt="Leruma Enterprises" style="width:158px;height:auto;display:block" />
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
      <span style="font-size:23px;font-weight:800;color:#103863;letter-spacing:-.5px;text-align:center;line-height:1.15">Leruma Distribution Centre</span>
      <span style="display:inline-flex;align-items:center;background:rgba(29,125,196,.1);border-radius:999px;padding:7px 15px">
        <span style="font-size:12.5px;font-weight:700;color:#1668A6;letter-spacing:.2px;text-align:center">Always make customer's rights</span>
      </span>
    </div>
  </div>

  <div style="flex:none;background:#fff;border-radius:32px 32px 0 0;padding:22px 18px 0;box-shadow:0 -16px 44px rgba(16,56,99,.13);position:relative;z-index:2">

    <div style="width:44px;height:4px;border-radius:4px;background:#E7ECF3;margin:0 auto 16px"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:23px;font-weight:800;letter-spacing:-.5px;color:#103863">Karibu tena</span>
        <span style="font-size:12.5px;font-weight:600;color:#8A94A6">Sign in to start selling</span>
      </div>
      <sc-if value="{{ showClient }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ changeClient }}" style="display:flex;align-items:center;gap:6px;background:#EAF3FB;border:1.5px solid #CFE3F4;border-radius:999px;padding:8px 13px" style-active="background:#DCEBF8">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1D7DC4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>
          <span style="font-size:12.5px;font-weight:800;color:#1D7DC4">{{ clientName }}</span>
        </button>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;font-weight:800;letter-spacing:1px;color:#8A94A6">USERNAME</span>
        <div style="display:flex;align-items:center;gap:10px;height:56px;border-radius:16px;padding:0 14px;background:{{ userBg }};border:1.5px solid {{ userBorder }};box-shadow:{{ userGlow }};transition:box-shadow .16s ease">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.4 3.1-6 7-6s7 2.6 7 6"></path></svg>
          <input value="{{ username }}" onChange="{{ onUser }}" onFocus="{{ focusUser }}" onBlur="{{ blurField }}" placeholder="e.g. anzwari.m" autoComplete="username" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:15.5px;font-weight:700;color:#0F172A;height:52px" />
          <sc-if value="{{ hasUser }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ clearUser }}" style="width:28px;height:28px;border-radius:9px;background:#E7ECF3;display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5A6577" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </sc-if>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;font-weight:800;letter-spacing:1px;color:#8A94A6">PASSWORD</span>
        <div style="display:flex;align-items:center;gap:10px;height:56px;border-radius:16px;padding:0 14px;background:{{ passBg }};border:1.5px solid {{ passBorder }};box-shadow:{{ passGlow }};transition:box-shadow .16s ease">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A6" stroke-width="2" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V7.8a4 4 0 018 0v2.7"></path></svg>
          <input value="{{ password }}" onChange="{{ onPass }}" onFocus="{{ focusPass }}" onBlur="{{ blurField }}" type="{{ passType }}" placeholder="••••••••" autoComplete="current-password" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:15.5px;font-weight:700;color:#0F172A;height:52px;letter-spacing:.4px" />
          <button onClick="{{ toggleReveal }}" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none" aria-label="Show password">
            <sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A8699" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
            </sc-if>
            <sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1D7DC4" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle><path d="M4 20L20 4"></path></svg>
            </sc-if>
          </button>
        </div>
      </div>

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:8px;background:#FDECEC;border:1px solid #F3C4C4;border-radius:12px;padding:9px 11px;animation:shake .35s ease">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D14343" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.4v.2"></path></svg>
          <span style="font-size:12.5px;font-weight:700;color:#C33B3B">{{ error }}</span>
        </div>
      </sc-if>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0">
        <button onClick="{{ toggleRemember }}" style="display:flex;align-items:center;gap:8px;min-height:44px;padding-right:8px" style-active="opacity:.6">
          <span style="width:22px;height:22px;border-radius:7px;border:1.5px solid {{ rememberBorder }};background:{{ rememberBg }};display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ rememberTick }}" stroke-width="3.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"></path></svg>
          </span>
          <span style="font-size:13px;font-weight:700;color:#475569;white-space:nowrap">Remember me</span>
        </button>
        <button style="font-size:13px;font-weight:700;color:#1D7DC4;min-height:44px;padding-left:8px;white-space:nowrap" style-active="opacity:.6">Forgot?</button>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button onClick="{{ submit }}" style="flex:1;height:58px;border-radius:18px;background:{{ btnBg }};display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px rgba(16,56,99,.28)" style-active="opacity:.9">
          <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
            <span style="width:19px;height:19px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite"></span>
          </sc-if>
          <span style="font-size:16.5px;font-weight:800;color:#fff;letter-spacing:.2px">{{ btnLabel }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12.5 6l6 6-6 6"></path></svg>
        </button>
        <sc-if value="{{ showBiometric }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ bioLogin }}" style="width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid #CFE3F4;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(29,125,196,.16)" style-active="background:#EAF3FB" aria-label="Login with fingerprint">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ bioColor }}" stroke-width="1.7" stroke-linecap="round"><path d="M12 10.5v3.2a7.5 7.5 0 01-1 3.8"></path><path d="M8.8 8.6a4.4 4.4 0 016.6 3.8c0 1.9-.2 3.4-.7 4.8"></path><path d="M5.9 13.5c0-1 .1-2 .3-2.7"></path><path d="M7.6 5.6A7.6 7.6 0 0119 12.4c0 2.2-.2 4-.7 5.6"></path><path d="M4.2 9.4a7.7 7.7 0 011.6-2.2"></path><path d="M8.9 19.5c.5-1 .8-2.1.9-3.3"></path></svg>
          </button>
        </sc-if>
      </div>
      <sc-if value="{{ bioPrompt }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:center;gap:7px;padding-top:2px;animation:fadeIn .2s ease">
          <span style="width:13px;height:13px;border-radius:50%;border:2px solid rgba(29,125,196,.3);border-top-color:#1D7DC4;animation:spin .7s linear infinite"></span>
          <span style="font-size:12.5px;font-weight:700;color:#1D7DC4">Touch the sensor to sign in</span>
        </div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0 34px;margin-top:14px;border-top:1px solid #F1F4F8">
      <span style="font-size:11.5px;font-weight:600;color:#A3ADBC">Powered by <strong style="font-weight:800;color:#5A6577">Moinfotech</strong></span>
      <span style="font-size:10.5px;font-weight:600;color:#C3CBD8">Version 1.0.0+10</span>
    </div>
  </div>

  <sc-if value="{{ clientOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeClient }}" style="position:absolute;inset:0;background:rgba(4,26,61,.5);z-index:40;animation:fadeIn .18s ease"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px 30px;z-index:50;animation:sheetUp .24s cubic-bezier(.2,.8,.3,1);box-shadow:0 -8px 30px rgba(15,23,42,.2)">
      <div style="width:38px;height:4px;border-radius:4px;background:#E2E8F1;margin:0 auto 14px"></div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:12px">
        <span style="font-size:18px;font-weight:800">Change client</span>
        <span style="font-size:12.5px;font-weight:600;color:#8A94A6">Pick the business this device sells for</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ clients }}" as="c" hint-placeholder-count="3">
          <button onClick="{{ c.pick }}" style="display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px;border-radius:14px;background:{{ c.bg }};border:1.5px solid {{ c.border }}" style-active="background:#E9F0FA">
            <span style="width:38px;height:38px;border-radius:12px;background:#103863;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">{{ c.initial }}</span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column">
              <span style="font-size:15px;font-weight:700">{{ c.name }}</span>
              <span style="font-size:12px;font-weight:600;color:#7A8699">{{ c.host }}</span>
            </span>
            <sc-if value="{{ c.active }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D7DC4" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:#fff;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:64px 30px 30px;animation:fadeIn .2s ease">
      <div style="width:78px;height:78px;border-radius:50%;background:#E7F6EE;display:flex;align-items:center;justify-content:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.4)">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"></path></svg>
      </div>
      <div style="font-size:19px;font-weight:800;margin-top:6px">{{ welcome }}</div>
      <div style="font-size:13.5px;font-weight:600;color:#7A8699;text-align:center">{{ signedSub }}</div>
      <button onClick="{{ signOut }}" style="height:50px;width:100%;border-radius:14px;background:#F1F4F8;color:#334155;font-size:15px;font-weight:700;margin-top:20px" style-active="background:#E4EAF2">Back to login</button>
    </div>
  </sc-if>

</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:482,&quot;height&quot;:954},&quot;showClientSwitcher&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showBiometric&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}">
const CLIENTS = [
  { name: 'Leruma', host: 'leruma.pos.co.tz' },
  { name: 'Mvungi Distributors', host: 'mvungi.pos.co.tz' },
  { name: 'Demo store', host: 'demo.pos.co.tz' },
];

class Component extends DCLogic {
  state = {
    username: '',
    password: '',
    reveal: false,
    remember: true,
    focus: null,
    error: '',
    loading: false,
    signedIn: false,
    clientOpen: false,
    client: 'Leruma',
    bioPrompt: false,
  };

  bioLogin() {
    if (this.state.bioPrompt) return;
    this.setState({ bioPrompt: true, error: '' });
    this._b = setTimeout(() => this.setState({ bioPrompt: false, signedIn: true, username: this.state.username || 'anzwari.m' }), 1400);
  }

  submit() {
    const { username, password } = this.state;
    if (!username.trim() || !password) {
      return this.setState({ error: 'Enter both username and password' });
    }
    this.setState({ error: '', loading: true });
    this._t = setTimeout(() => this.setState({ loading: false, signedIn: true }), 1100);
  }

  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._b); }

  renderVals() {
    const s = this.state;
    const err = !!s.error;
    const field = (name) => ({
      bg: s.focus === name ? '#FFFFFF' : '#F6F8FC',
      border: err ? '#F3C4C4' : s.focus === name ? '#1D7DC4' : '#E6EBF2',
      glow: s.focus === name ? '0 0 0 4px rgba(29,125,196,.13)' : '0 0 0 0 rgba(29,125,196,0)',
    });
    const u = field('user');
    const p = field('pass');

    return {
      showClient: this.props.showClientSwitcher ?? true,
      clientName: s.client,
      changeClient: () => this.setState({ clientOpen: true }),
      closeClient: () => this.setState({ clientOpen: false }),
      clientOpen: s.clientOpen,
      clients: CLIENTS.map((c) => ({
        name: c.name,
        host: c.host,
        initial: c.name[0],
        active: c.name === s.client,
        bg: c.name === s.client ? '#F1F5FB' : '#F7F9FC',
        border: c.name === s.client ? '#D5E3F7' : '#EEF1F5',
        pick: () => this.setState({ client: c.name, clientOpen: false }),
      })),

      username: s.username,
      hasUser: !!s.username,
      onUser: (e) => this.setState({ username: e.target.value, error: '' }),
      clearUser: () => this.setState({ username: '' }),
      focusUser: () => this.setState({ focus: 'user' }),
      userBg: u.bg,
      userBorder: u.border,
      userGlow: u.glow,

      password: s.password,
      onPass: (e) => this.setState({ password: e.target.value, error: '' }),
      focusPass: () => this.setState({ focus: 'pass' }),
      blurField: () => this.setState({ focus: null }),
      passBg: p.bg,
      passBorder: p.border,
      passGlow: p.glow,
      passType: s.reveal ? 'text' : 'password',
      hidden: !s.reveal,
      revealed: s.reveal,
      toggleReveal: () => this.setState({ reveal: !s.reveal }),

      hasError: err,
      error: s.error,

      remember: s.remember,
      toggleRemember: () => this.setState({ remember: !s.remember }),
      rememberBg: s.remember ? '#1D7DC4' : '#FFFFFF',
      rememberBorder: s.remember ? '#1D7DC4' : '#D5DCE6',
      rememberTick: s.remember ? '#FFFFFF' : 'transparent',

      loading: s.loading,
      btnLabel: s.loading ? 'Signing in…' : 'Login',
      btnBg: s.loading
        ? 'linear-gradient(135deg,#4E93C8 0%,#2A5C8F 100%)'
        : 'linear-gradient(135deg,#1D7DC4 0%,#103863 100%)',
      submit: () => this.submit(),
      showBiometric: this.props.showBiometric ?? true,
      bioPrompt: s.bioPrompt,
      bioColor: s.bioPrompt ? '#0A3F8F' : '#1D7DC4',
      bioLogin: () => this.bioLogin(),

      signedIn: s.signedIn,
      welcome: 'Karibu, ' + (s.username || 'seller'),
      signedSub: s.client + ' · signed in on this device',
      signOut: () => this.setState({ signedIn: false, password: '' }),
    };
  }
}
</script>
</body>
</html>
