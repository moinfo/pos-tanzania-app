<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mopos Expenses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
.dsp{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;flex-shrink:0}
.card{background:#fff;border:1px solid #E9ECEF;border-radius:20px}
.eyebrow{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F59E0B}
.ttl{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:36px;line-height:40px;font-weight:800;letter-spacing:-0.03em;color:#fff}
.tile{width:44px;height:52px;flex-shrink:0;border-radius:22px 22px 10px 10px;background:#F8F9FA;color:#2B2D42;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-sizing:border-box}
.sec{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;line-height:26px;font-weight:700;letter-spacing:-0.01em;color:#2B2D42}
.fab{position:absolute;right:16px;bottom:24px;height:52px;padding:0 22px 0 16px;border-radius:999px;border:0;background:#F59E0B;color:#2B2D42;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px rgba(11,35,64,.3);cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:880px;box-sizing:border-box;display:flex;flex-direction:column;background:#F8F9FA;font-family:'Public Sans',system-ui,sans-serif;color:#2B2D42;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">

  <header style="flex-shrink:0;position:relative;overflow:hidden;background:#0D47A1;border-radius:0 0 32px 32px;padding:8px 16px 22px 12px">
    <svg width="170" height="94" viewBox="0 0 200 110" style="position:absolute;right:-4px;bottom:0" aria-hidden="true">
      <circle cx="170" cy="20" r="11" fill="#F59E0B"></circle>
      <path d="M14 110V86a28 28 0 0 1 56 0v24z" fill="#1565C0" fill-opacity=".55"></path>
      <path d="M60 110V62a36 36 0 0 1 72 0v48z" fill="#1565C0" fill-opacity=".85"></path>
      <path d="M122 110V84a30 30 0 0 1 60 0v26z" fill="#42A5F5" fill-opacity=".45"></path>
      <path d="M78 110V92a18 18 0 0 1 36 0v18z" fill="#F59E0B"></path>
      <path d="M140 110V98a12 12 0 0 1 24 0v12z" fill="#F59E0B"></path>
    </svg>
    <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:6px">
      <button class="ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></button>
      <div style="padding:0 4px;display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Money out</span><h1 class="ttl">Expenses</h1></div>
    </div>
  </header>

  <main style="flex-shrink:0;display:flex;flex-direction:column;gap:16px;padding:18px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E9ECEF;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:#2B2D42"><span style="width:8px;height:8px;border-radius:999px;background:#F59E0B"></span>1–29 Oct 2026</div>
      <button style="width:44px;height:44px;border-radius:999px;border:1px solid #6C757D;background:#fff;color:#2B2D42;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="Pick a period"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
    </div>

    <section aria-label="Total expenses" style="position:relative;overflow:hidden;background:#0D47A1;border-radius:24px;padding:20px 18px;min-height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:2px">
      <svg width="140" height="77" viewBox="0 0 200 110" style="position:absolute;right:0;bottom:0" aria-hidden="true">
        <circle cx="170" cy="20" r="11" fill="#F59E0B"></circle>
        <path d="M14 110V86a28 28 0 0 1 56 0v24z" fill="#1565C0" fill-opacity=".55"></path>
        <path d="M60 110V62a36 36 0 0 1 72 0v48z" fill="#1565C0" fill-opacity=".85"></path>
        <path d="M122 110V84a30 30 0 0 1 60 0v26z" fill="#42A5F5" fill-opacity=".45"></path>
        <path d="M78 110V92a18 18 0 0 1 36 0v18z" fill="#F59E0B"></path>
        <path d="M140 110V98a12 12 0 0 1 24 0v12z" fill="#F59E0B"></path>
      </svg>
      <span style="position:relative;font-size:13px;line-height:18px;color:#E9ECEF">Total expenses · 1 entry</span>
      <span class="dsp" style="position:relative;font-size:40px;line-height:46px;font-weight:700;letter-spacing:-0.03em;color:#fff"><span style="font-size:14px;font-weight:600;color:#E9ECEF;letter-spacing:0">TZS </span>10,000</span>
    </section>

    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 class="sec" style="padding:0 4px">Entries</h2>
      <article class="card" style="padding:12px 8px 12px 16px;display:flex;align-items:center;gap:12px">
        <div class="tile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l2 5H4z"></path><path d="M5 8v13h14V8"></path><path d="M10 12h4"></path></svg></div>
        <div style="flex-grow:1;display:flex;flex-direction:column"><span style="font-size:16px;line-height:22px;font-weight:600;color:#2B2D42">chakula</span><span style="font-size:13px;line-height:18px;color:#6C757D">Lodge · 29 Oct 2026</span></div>
        <span class="dsp" style="font-size:18px;font-weight:700;color:#2B2D42">10,000</span>
        <button class="ib" style="color:#6C757D" aria-label="Delete expense chakula"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </article>
    </div>

    <section aria-labelledby="cat" class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px">
      <h2 id="cat" class="sec">By category</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:52px;font-size:14px;color:#2B2D42">Lodge</span>
        <div style="flex-grow:1;height:12px;border-radius:999px;background:#E9ECEF;overflow:hidden" role="img" aria-label="100% of expenses"><div style="width:100%;height:12px;background:#F59E0B"></div></div>
        <span class="dsp" style="width:44px;text-align:right;font-size:16px;font-weight:700">10K</span>
      </div>
    </section>
  </main>

  <button class="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Expense</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
