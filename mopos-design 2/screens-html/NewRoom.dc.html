<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mopos New room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button,input,select,textarea{font-family:inherit}
.dsp{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;flex-shrink:0}
.card{background:#fff;border:1px solid #E9ECEF;border-radius:20px}
.arch{width:44px;height:52px;flex-shrink:0;border-radius:22px 22px 10px 10px;background:#F59E0B;color:#2B2D42;display:flex;align-items:center;justify-content:center;padding-top:8px;box-sizing:border-box;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700}
.bd{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.bd i{width:6px;height:6px;border-radius:999px;display:inline-block}
.bd.lit{background:#FEF3C7;color:#92400E}.bd.lit i{background:#F59E0B}
.eyebrow{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F59E0B}
.ttl{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:36px;line-height:40px;font-weight:800;letter-spacing:-0.03em;color:#fff}
.lbl{font-size:13px;line-height:18px;font-weight:600;color:#2B2D42}
.inp{height:48px;width:100%;box-sizing:border-box;border:1px solid #6C757D;border-radius:14px;padding:0 14px;font-size:15px;color:#2B2D42;background:#fff}
.inp::placeholder{color:#6C757D}
.inp:focus{outline:2px solid #1565C0;outline-offset:1px}
.fld{display:flex;flex-direction:column;gap:6px}
.pre{position:absolute;left:14px;top:0;height:48px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#6C757D}
</style>
</helmet>
<div style="width:390px;height:880px;box-sizing:border-box;display:flex;flex-direction:column;background:#F8F9FA;font-family:'Public Sans',system-ui,sans-serif;color:#2B2D42;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">

  <header style="position:relative;overflow:hidden;background:#0D47A1;border-radius:0 0 32px 32px;padding:8px 16px 22px 16px">
    <svg width="200" height="110" viewBox="0 0 200 110" style="position:absolute;right:0;bottom:0" aria-hidden="true">
      <circle cx="170" cy="20" r="11" fill="#F59E0B"></circle>
      <path d="M14 110V86a28 28 0 0 1 56 0v24z" fill="#1565C0" fill-opacity=".55"></path>
      <path d="M60 110V62a36 36 0 0 1 72 0v48z" fill="#1565C0" fill-opacity=".85"></path>
      <path d="M122 110V84a30 30 0 0 1 60 0v26z" fill="#42A5F5" fill-opacity=".45"></path>
      <path d="M78 110V92a18 18 0 0 1 36 0v18z" fill="#F59E0B"></path>
      <path d="M140 110V98a12 12 0 0 1 24 0v12z" fill="#F59E0B"></path>
    </svg>
    <div style="position:relative;z-index:1;display:flex;align-items:center;gap:2px">
      <button class="ib" aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
      <div style="display:flex;align-items:center;gap:8px;flex-grow:1"><div class="dsp" style="width:30px;height:30px;border-radius:15px 15px 8px 8px;background:#F59E0B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#2B2D42">M</div><span class="dsp" style="font-size:19px;font-weight:700;color:#fff">Mopos</span></div>
    </div>
    <div style="position:relative;z-index:1;padding:14px 6px 0 6px;display:flex;flex-direction:column;gap:2px">
      <span class="eyebrow">2 rooms · 2 occupied</span>
      <h1 class="ttl">Rooms</h1>
    </div>
  </header>

  <main style="display:flex;flex-direction:column;gap:12px;padding:18px 16px">
    <article class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px"><div class="arch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V10a6 6 0 0 1 12 0v11"></path><path d="M3 21h18"></path><path d="M14.5 14h.01"></path></svg></div><div style="flex-grow:1;display:flex;flex-direction:column"><span class="dsp" style="font-size:20px;line-height:26px;font-weight:700;color:#2B2D42">Executive Garden Suite</span><span style="font-size:13px;line-height:18px;color:#6C757D">Single · TZS 25,000 / night</span><span class="bd lit" style="align-self:flex-start;margin-top:6px"><i></i>Occupied</span></div></article>
    <article class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px"><div class="arch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V10a6 6 0 0 1 12 0v11"></path><path d="M3 21h18"></path><path d="M14.5 14h.01"></path></svg></div><div style="flex-grow:1;display:flex;flex-direction:column"><span class="dsp" style="font-size:20px;line-height:26px;font-weight:700;color:#2B2D42">Standard Single Room</span><span style="font-size:13px;line-height:18px;color:#6C757D">Single · TZS 30,000 / night</span><span class="bd lit" style="align-self:flex-start;margin-top:6px"><i></i>Occupied</span></div></article>
  </main>

  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(43,45,66,.6)" aria-hidden="true"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:10px 20px 28px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="width:40px;height:4px;border-radius:999px;background:#E9ECEF;align-self:center"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="arch" style="width:36px;height:42px;font-size:14px;padding-bottom:6px;background:#2B2D42;color:#fff">+</div>
      <h2 id="sheet-title" class="dsp" style="margin:0;flex-grow:1;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-0.02em;color:#2B2D42">New room</h2>
      <button class="ib" style="color:#2B2D42;margin-right:-10px" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div class="fld"><label class="lbl" for="rn">Room name *</label><input id="rn" class="inp" type="text" placeholder="e.g. Executive Garden Suite"></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div class="fld"><label class="lbl" for="rc">Room number <span style="font-weight:400;color:#6C757D">(optional)</span></label><input id="rc" class="inp" type="text" placeholder="e.g. R3"></div>
      <div class="fld"><label class="lbl" for="rt">Room type</label><input id="rt" class="inp" type="text" placeholder="e.g. Single"></div>
    </div>
    <div class="fld"><label class="lbl" for="ru">Use</label>
      <select id="ru" class="inp"><option>Guests (for sale)</option><option>Staff</option><option>Storage</option></select>
    </div>
    <div class="fld"><label class="lbl" for="rr">Rate per night</label>
      <div style="position:relative"><span class="pre">TZS</span><input id="rr" class="inp" type="text" inputmode="numeric" placeholder="0" style="padding-left:52px"></div>
    </div>
    <div class="fld"><label class="lbl" for="rd">Description <span style="font-weight:400;color:#6C757D">(optional)</span></label>
      <textarea id="rd" class="inp" rows="2" style="height:72px;padding:12px 14px;resize:none" placeholder="Beds, bathroom, notes…"></textarea>
    </div>
    <button style="height:52px;border-radius:16px;border:0;background:#1565C0;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Save room</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
