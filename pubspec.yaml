name: pos_tanzania_mobile
description: Point of Sales Tanzania Mobile App - Flutter application for POS management
version: 1.0.0+41
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.1.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.1

  # Image picker for Z report photos
  image_picker: ^1.0.4

  # File picker
  file_picker: ^10.0.0

  # Date formatting
  intl: ^0.18.1

  # Shared preferences
  shared_preferences: ^2.2.2

  # Crypto for password hashing
  crypto: ^3.0.3

  # Loading indicators
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # Image caching
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

  # Biometric authentication
  local_auth: ^2.3.0
  flutter_svg: ^2.0.10

  # PDF generation and printing
  pdf: ^3.10.7
  printing: ^5.12.0

  # PDF viewing
  flutter_pdfview: ^1.3.2

  # File sharing
  share_plus: ^7.2.2

  # Path provider
  path_provider: ^2.1.1

  # URL launcher for external links
  url_launcher: ^6.2.2

  # SQLite database for offline support
  sqflite: ^2.3.0
  path: ^1.8.3

  # Network connectivity monitoring
  connectivity_plus: ^5.0.2

  # UUID generation for local IDs
  uuid: ^4.2.1

  # NFC for customer card scanning
  nfc_manager: ^4.1.1

  # App version info
  package_info_plus: ^8.0.0

  # GPS location for shop registration (SADA)
  geolocator: ^13.0.2

  # Push notifications for approvals (Leruma flavor only -- it is the only
  # flavor with a google-services.json). Firebase is initialised defensively so
  # the other four clients keep running with polling alone.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # FCM does not draw anything itself while the app is in the foreground;
  # this is what puts the notification in the tray in that case.
  flutter_local_notifications: ^22.3.0

  # Launcher/home-screen icon badge, so a manager who is NOT in the app can
  # still see that something is waiting. flutter_app_badger, the package most
  # search results still point at, is marked discontinued on pub.dev and last
  # shipped three years ago; this is the maintained successor and the only one
  # of the alternatives with recent releases and real download numbers.
  app_badge_plus: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - logo.png
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "sada-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "sada-logo.png"
  remove_alpha_ios: true
